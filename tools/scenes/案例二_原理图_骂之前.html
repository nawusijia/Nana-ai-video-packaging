<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0f172a;font-family:"Noto Sans CJK SC",sans-serif;color:#e2e8f0}
.box{position:absolute;top:440px;width:300px;height:200px;border-radius:20px;background:#1e293b;border:2px solid #38bdf8;display:flex;flex-direction:column;align-items:center;justify-content:center}
.box .n{font-size:28px;color:#38bdf8;margin-bottom:12px}.box .t{font-size:34px;font-weight:700}
.arr{position:absolute;top:530px;height:4px;background:#38bdf8}
.h{position:absolute;top:160px;width:100%;text-align:center;font-size:64px;font-weight:700}
</style></head><body>
<div class="h" id="h">代码做视频的原理</div>
<script>
window.SCENE={w:1920,h:1080,fps:30,duration:6};
const steps=[['01','网页画动画'],['02','逐帧截图'],['03','代码合成音乐'],['04','ffmpeg出片']];
const boxes=steps.map((s,i)=>{const d=document.createElement('div');d.className='box';d.style.left=(150+i*430)+'px';d.innerHTML=`<div class="n">${s[0]}</div><div class="t">${s[1]}</div>`;document.body.appendChild(d);return d});
const arrs=[0,1,2].map(i=>{const a=document.createElement('div');a.className='arr';a.style.left=(450+i*430)+'px';document.body.appendChild(a);return a});
const c=x=>Math.min(1,Math.max(0,x));
window.seek=t=>{
  document.getElementById('h').style.opacity=c(t/.5);
  boxes.forEach((b,i)=>{const k=c((t-.6-i*1.1)/.4);b.style.opacity=k;b.style.transform=`translateY(${(1-k)*30}px)`});
  arrs.forEach((a,i)=>{a.style.width=(c((t-1.1-i*1.1)/.4)*130)+'px'});
  document.body.style.opacity=1-c((t-5.6)/.4);
};
seek(0);
</script></body></html>
