<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:"Noto Sans CJK SC",sans-serif}
.sub{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:56px;font-weight:700;color:#fff;
  -webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 3px 6px rgba(0,0,0,.5)}
.pop{position:absolute;left:50%;top:170px;font-size:110px;font-weight:900;white-space:nowrap;-webkit-text-stroke:6px #000;paint-order:stroke fill;transform-origin:50% 50%}
</style></head><body>
<div class="sub" id="sub"></div>
<div class="pop" id="pop"></div>
<script>
window.SCENE={w:1920,h:1080,fps:30,duration:12};
const subs=[[0.24,4.34,"先说好，这条视频从我的口播到所有包装"],[4.67,6.46,"全程由Claude生成"],[8.04,8.88,"你问我干了啥？"],[10.74,12.05,"我负责吐槽"]];
const pops=[[4.67,7.6,"全程由Claude生成！","#ffe14d"],[10.74,12.06,"我负责吐槽！","#ff4d4d"]];
const C=x=>Math.min(1,Math.max(0,x));
const back=x=>{x=C(x);const c=2;return 1+(c+1)*(x-1)**3+c*(x-1)**2};
window.seek=t=>{
  const s=subs.find(s=>t>=s[0]&&t<=s[1]+.2);document.getElementById('sub').textContent=s?s[2]:'';
  const p=pops.find(p=>t>=p[0]&&t<=p[1]);const el=document.getElementById('pop');
  if(p){el.textContent=p[2];el.style.color=p[3];const k=back((t-p[0])/.3);
    const shake=p[3]=='#ff4d4d'?Math.sin(t*40)*4:0;
    el.style.transform=`translate(-50%,0) scale(${k}) rotate(${shake}deg)`;el.style.opacity=1}
  else el.style.opacity=0;
};
seek(0);
</script></body></html>
